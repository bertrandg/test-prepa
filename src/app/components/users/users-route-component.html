<button
  (click)="addUser()"
  matButton="outlined"
>
  Add
</button>

<hr class="my-3">

<ul class="overflow-hidden">
  @for (user of usersService.users(); track user.id) {
    <li class="flex items-center justify-between gap-1 my-2 bg-blue-100 py-2 px-5 overflow-hidden">
      <div class="w-[100px] shrink-0 truncate">{{ user.name }}</div>
      <div class="basis-full truncate">{{ user.description }}</div>
      <div class="w-[100px] shrink-0 truncate">{{ user.birthdate | displayableDate | date: 'dd/MM/y' }}</div>
      <div class="w-[200px] shrink-0 flex gap-1">
        <button
          (click)="updateUser(user)"
          matButton="outlined"
        >
          Update
        </button>
        <button
          (click)="deleteUser(user.id)"
          matButton="outlined"
        >
          Delete
        </button>
      </div>
    </li>
  }
</ul>
