<h2 mat-dialog-title>
  <mat-icon>edit</mat-icon>
  Edition
</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field class="w-full">
      <mat-label>Name</mat-label>
      <input formControlName="name" matInput placeholder="Name">
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Description</mat-label>
      <textarea class="!h-[220px]" formControlName="description" matInput placeholder="Description..."></textarea>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Birthdate</mat-label>
      <input [matDatepicker]="picker" formControlName="birthdate" matInput>
      <mat-hint>dd/MM/yyyy</mat-hint>
      <mat-datepicker #picker></mat-datepicker>
      <mat-datepicker-toggle [for]="picker" matIconSuffix></mat-datepicker-toggle>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-dialog-close matButton>Cancel</button>
  <button
    (click)="update()"
    [disabled]="form.invalid"
    matButton
  >
    Update
  </button>
</mat-dialog-actions>
